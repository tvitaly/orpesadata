name: Build app cache bundle

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'media/**'
      - 'maps/**'
      - 'legal/**'
      - 'tools/build_app_cache.py'
      - '.github/workflows/build-cache-pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-orpesadata
  cancel-in-progress: true

jobs:
  build:
    name: Build ZIP, manifest and legal pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build cache bundle and pages
        run: python3 tools/build_app_cache.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
